[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-copilot"
version = "0.1.0"
description = "Retail & E-commerce Commercial Analytics Copilot portfolio project"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nitin", email = "student@example.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "sqlglot>=20.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "pyyaml>=6.0.1",
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.16.0",
    "shap>=0.44.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "httpx>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
